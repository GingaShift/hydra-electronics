<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#1665a8"/></marker></defs><rect width="1100" height="560" fill="#f5f9fd"/><g font-family="Arial,sans-serif" fill="#10324b"><text x="550" y="35" font-size="25" text-anchor="middle">HYDRA — intégration Main Board V1</text><rect x="20" y="100" width="140" height="95" rx="10" fill="white" stroke="#1665a8" stroke-width="2"/><text x="90.0" y="127" font-size="18" text-anchor="middle">PC surface</text><text x="90.0" y="152" font-size="14" text-anchor="middle">Pilotage / vidéo</text><rect x="215" y="100" width="240" height="95" rx="10" fill="white" stroke="#1665a8" stroke-width="2"/><text x="335.0" y="127" font-size="18" text-anchor="middle">Pi4 + Navigator</text><text x="335.0" y="152" font-size="14" text-anchor="middle">BlueOS / ArduSub</text><text x="335.0" y="173" font-size="14" text-anchor="middle">ESC, IMU, BAR30, fuites</text><rect x="550" y="100" width="220" height="95" rx="10" fill="white" stroke="#1665a8" stroke-width="2"/><text x="660.0" y="127" font-size="18" text-anchor="middle">STM32 Main Board</text><text x="660.0" y="152" font-size="14" text-anchor="middle">UART 3,3 V / SWD / USB</text><text x="660.0" y="173" font-size="14" text-anchor="middle">8 GPIO logiques V2</text><rect x="875" y="85" width="200" height="75" rx="10" fill="white" stroke="#1665a8" stroke-width="2"/><text x="975.0" y="112" font-size="18" text-anchor="middle">Flash SPI2</text><text x="975.0" y="137" font-size="14" text-anchor="middle">W25Q128JVSIQ</text><rect x="875" y="210" width="200" height="75" rx="10" fill="white" stroke="#1665a8" stroke-width="2"/><text x="975.0" y="237" font-size="18" text-anchor="middle">BME280</text><text x="975.0" y="262" font-size="14" text-anchor="middle">I2C3 / 0x77 / interne</text><rect x="215" y="355" width="240" height="100" rx="10" fill="white" stroke="#1665a8" stroke-width="2"/><text x="335.0" y="382" font-size="18" text-anchor="middle">Power Board</text><text x="335.0" y="407" font-size="14" text-anchor="middle">5 V vers Main Board</text><text x="335.0" y="428" font-size="14" text-anchor="middle">6 à 9 INA226 externes</text><rect x="550" y="355" width="220" height="100" rx="10" fill="white" stroke="#1665a8" stroke-width="2"/><text x="660.0" y="382" font-size="18" text-anchor="middle">Deux Lumen</text><text x="660.0" y="407" font-size="14" text-anchor="middle">Énergie Power Board</text><text x="660.0" y="428" font-size="14" text-anchor="middle">PWM commun Navigator</text><path d="M160,145 H215" fill="none" stroke="#1665a8" stroke-width="2" marker-end="url(#a)"/><text x="187" y="132" font-size="13" text-anchor="middle">Ethernet</text><path d="M455,145 H550" fill="none" stroke="#1665a8" stroke-width="2" marker-end="url(#a)"/><text x="502" y="132" font-size="13" text-anchor="middle">UART J3</text><path d="M770,125 H875" fill="none" stroke="#1665a8" stroke-width="2" marker-end="url(#a)"/><text x="822" y="112" font-size="13" text-anchor="middle">SPI dédié</text><path d="M770,170 H820 V247 H875" fill="none" stroke="#1665a8" stroke-width="2" marker-end="url(#a)"/><text x="824" y="235" font-size="13" text-anchor="middle">I2C interne</text><path d="M455,380 H505 V195 H550" fill="none" stroke="#1665a8" stroke-width="2" marker-end="url(#a)"/><text x="610" y="245" font-size="13" text-anchor="middle">5 V J1 + I2C/ALERT J2</text><path d="M455,405 H550" fill="none" stroke="#1665a8" stroke-width="2" marker-end="url(#a)"/><text x="502" y="393" font-size="13" text-anchor="middle">Énergie Lumen</text><path d="M335,195 V305 H660 V355" fill="none" stroke="#1665a8" stroke-width="2" marker-end="url(#a)"/><text x="588" y="295" font-size="13" text-anchor="middle">PWM Navigator — aucun passage par Main Board</text><text x="550" y="510" font-size="16" text-anchor="middle">UART : Main TX → Navigator SERIAL3 RX (3) ; Main RX ← TX (2) ; GND commun (6).</text><text x="550" y="538" font-size="15" text-anchor="middle">Contour PCB provisoire ; interfaces logiques 3,3 V ; aucune entrée 48 V sur Main Board.</text></g></svg>